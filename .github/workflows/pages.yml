# Builds docs/ with build.py and deploys to GitHub Pages.
# Before enabling: Settings -> Pages -> Source = "GitHub Actions".
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly events refresh (Thursdays 10:00 UTC = 6am EDT / 5am EST)
    - cron: "0 10 * * 4"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Project sites live under /<repo-name>. Use "" for a custom domain or a <user>.github.io repo.
  BASE_PATH: /sj-shore-guide
  PATH_PREFIX: /sj-shore-guide   # alias read by build.py if BASE_PATH is empty
  SITE_URL: https://jgonthego.github.io
  # Optional: set repository variable FORM_ID (e.g. a Formspree form id) to enable the signup form.
  FORM_ID: ${{ vars.FORM_ID }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # Pulls every source in scripts/fetch_events.py: official town calendars (Tribe/EvoGov/CivicPlus),
      # Ocean County Tourism, Wildwoods tourism, OC Regional Chamber and Visit Somers Point, plus
      # data/events_manual.json. Venue/city geocodes come from the committed Nominatim cache
      # (data/cache/nominatim.json; new lookups are rate-limited to 1 req/sec). Facebook is never scraped.
      - name: Refresh events (keeps last good data if a calendar is down)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 15
        run: |
          python scripts/fetch_events.py || echo "event fetch failed; using committed data/events.json"
      - name: Build
        run: python build.py
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
