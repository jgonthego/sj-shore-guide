# Builds docs/ with build.py and deploys to GitHub Pages.
# Before enabling: Settings -> Pages -> Source = "GitHub Actions".
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly events refresh (Thursdays 10:00 UTC = 6am EDT / 5am EST)
    - cron: "0 10 * * 4"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Project sites live under /<repo-name>. Use "" for a custom domain or a <user>.github.io repo.
  BASE_PATH: /sj-shore-guide
  PATH_PREFIX: /sj-shore-guide   # alias read by build.py if BASE_PATH is empty
  SITE_URL: https://jgonthego.github.io
  # Optional: set repository variable FORM_ID (e.g. a Formspree form id) to enable the signup form.
  FORM_ID: ${{ vars.FORM_ID }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh events (keeps last good data if a calendar is down)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python scripts/fetch_events.py || echo "event fetch failed; using committed data/events.json"
      - name: Build
        run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
